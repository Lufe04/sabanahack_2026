services:
  db:
    image: postgres:17-alpine
    container_name: arandanos_db
    environment:
      POSTGRES_USER: arandanos
      POSTGRES_PASSWORD: arandanos
      POSTGRES_DB: arandanos
    ports:
      - "5433:5432"
    volumes:
      - arandanos_pgdata:/var/lib/postgresql/data

volumes:
  arandanos_pgdata:
